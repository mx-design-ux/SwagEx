name: Release SwagEx

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Paid Apple Developer signing/notarization is intentionally not used.
      # Ad-hoc signing gives macOS a valid code signature while retaining the
      # one-time user approval required by Gatekeeper.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish the desktop updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: SwagEx v__VERSION__
          releaseBody: |
            ## Nouveautés de la v0.4.0

            - Choisissez directement **Compte** ou **Siège** après la configuration du proxy.
            - Le parcours **Siège** guide les quatre consultations nécessaires et crée un JSON dédié nommé `siege-JJMMAA.json`.
            - L’export **Compte** conserve son format et son fonctionnement existants.

            ## Télécharger SwagEx

            - [Mac récents · puce Apple](https://github.com/mx-design-ux/SwagEx/releases/download/v__VERSION__/SwagEx___VERSION___aarch64.dmg)
            - [Mac anciens · puce Intel](https://github.com/mx-design-ux/SwagEx/releases/download/v__VERSION__/SwagEx___VERSION___x64.dmg)
            - [Windows](https://github.com/mx-design-ux/SwagEx/releases/download/v__VERSION__/SwagEx___VERSION___x64-setup.exe)

            Les autres fichiers sont utilisés par la mise à jour automatique de SwagEx.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
