name: Release SwagEx

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Paid Apple Developer signing/notarization is intentionally not used.
      # Ad-hoc signing gives macOS a valid code signature while retaining the
      # one-time user approval required by Gatekeeper.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish the desktop updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: SwagEx v__VERSION__
          releaseBody: |
            Le bouton **Inclure Défenses WGB** reprend les marges internes des autres boutons. Il ajoute les défenses du Combat de guilde World au JSON du compte.

            Après l’export Compte, cliquez sur **Inclure Défenses WGB**, puis ouvrez **Tour de Guilde → Combat → Combat de guilde World → Défense** dans Summoners War.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  label-release-assets:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the download list user-friendly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"v${VERSION}\" and .draft) | .id")"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          RELEASE_API="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          MANIFEST_ID="$(gh api "${RELEASE_API}" --jq '.assets[] | select(.name == "latest.json") | .id')"
          [[ "${MANIFEST_ID}" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${MANIFEST_ID}" \
            | jq -e --arg version "${VERSION}" '
                .version == $version and
                ([.platforms["darwin-aarch64"], .platforms["darwin-x86_64"], .platforms["windows-x86_64"]]
                 | all((.url | type == "string" and length > 0) and (.signature | type == "string" and length > 0)))
              ' >/dev/null

          label_asset() {
            local name="$1"
            local label="$2"
            local asset_id
            asset_id="$(gh api "${RELEASE_API}" --jq ".assets[] | select(.name == \"${name}\") | .id")"
            if [[ -n "${asset_id}" ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" -f label="${label}" >/dev/null
            fi
          }

          gh api "${RELEASE_API}" --jq '.assets[] | select(.name | endswith(".sig")) | .id' | while read -r asset_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

          label_asset "SwagEx_${VERSION}_aarch64.dmg" "Mac récents · puce Apple"
          label_asset "SwagEx_${VERSION}_x64.dmg" "Mac anciens · puce Intel"
          label_asset "SwagEx_${VERSION}_x64-setup.exe" "Windows"
          label_asset "SwagEx_${VERSION}_aarch64.app.tar.gz" "Mise à jour automatique · Mac récents"
          label_asset "SwagEx_${VERSION}_x64.app.tar.gz" "Mise à jour automatique · Mac anciens"
          label_asset "latest.json" "Mise à jour automatique · manifeste"

          release_body="$(gh api "${RELEASE_API}" --jq '.body')"
          release_note="$(printf '%s\n' "${release_body}" | awk '/^## Télécharger SwagEx[[:space:]]*$/ { exit } { print }')"
          download_section="$(cat <<EOF
          ## Télécharger SwagEx

          - [Mac récents · puce Apple](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SwagEx_${VERSION}_aarch64.dmg)
          - [Mac anciens · puce Intel](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SwagEx_${VERSION}_x64.dmg)
          - [Windows](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SwagEx_${VERSION}_x64-setup.exe)

          Les autres fichiers sont utilisés par la mise à jour automatique de SwagEx.
          EOF
          )"

          gh api --method PATCH "${RELEASE_API}" -F draft=false -f make_latest=true -f body="${release_note}

          ${download_section}" >/dev/null
