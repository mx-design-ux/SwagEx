<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>SwagEx</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="splash-screen" id="splash-screen" aria-label="Chargement de SwagEx">
        <img class="splash-image" id="splash-image" alt="Chargement de SwagEx" />
      </section>

      <section class="app-screen" id="app-screen" hidden>
        <header class="app-header">
          <img class="brand-logo" src="/src/assets/ui/logo-swagex.svg" alt="SwagEx" />
          <p class="tagline">Summoners War Exporter. Votre iPhone et votre Mac doivent être connectés au même réseau local.</p>
        </header>

        <section class="flow-screen certificate-screen" id="certificate-screen" hidden aria-labelledby="certificate-title">
          <img class="screen-art" src="" id="certificate-art" alt="" aria-hidden="true" />
          <button class="dynamic-qr" id="certificate-download" type="button" aria-label="Télécharger le certificat SwagEx sur ce Mac">
            <img id="certificate-qr" alt="QR code pour télécharger le certificat SwagEx" />
          </button>
          <button class="screen-hitbox certificate-done-hitbox" id="certificate-done" type="button" aria-label="J’ai terminé"></button>
          <h1 id="certificate-title" class="visually-hidden">Certificat de l’iPhone</h1>
        </section>

        <section class="flow-screen proxy-screen" id="proxy-screen" hidden aria-labelledby="proxy-title">
          <img class="screen-art" src="" id="proxy-art" alt="" aria-hidden="true" />
          <div class="proxy-dynamic-step" aria-hidden="true">
            <span>Saisissez le serveur</span>
            <span><strong id="proxy-host">—</strong> et le port <strong id="proxy-port">—</strong></span>
          </div>
          <button class="screen-hitbox proxy-new-cert-hitbox" id="regenerate-certificate" type="button" aria-label="Nouveau certificat"></button>
          <button class="screen-hitbox proxy-done-hitbox" id="proxy-done" type="button" aria-label="C’est configuré"></button>
          <h1 id="proxy-title" class="visually-hidden">Proxy Wi-Fi de l’iPhone</h1>
        </section>

        <section class="flow-screen waiting-screen" id="waiting-screen" hidden aria-labelledby="waiting-title">
          <img class="screen-art" src="" id="waiting-art" alt="" aria-hidden="true" />
          <button class="screen-hitbox waiting-stop-hitbox" id="stop-listening" type="button" aria-label="Arrêter l’écoute"></button>
          <h1 id="waiting-title" class="visually-hidden">Lance le jeu, j’attends…</h1>
        </section>

        <section class="flow-screen json-screen" id="json-screen" hidden aria-labelledby="json-title">
          <img class="screen-art" src="" id="json-art" alt="" aria-hidden="true" />
          <div class="json-dynamic-file" aria-hidden="true"><img src="" alt="" /><span id="export-name">—</span></div>
          <button class="screen-hitbox json-file-hitbox" id="reveal-export" type="button" aria-label="Afficher le fichier JSON dans le Finder"></button>
          <button class="screen-hitbox json-quit-hitbox" id="quit-app" type="button" aria-label="Quitter SwagEx"></button>
          <h1 id="json-title" class="visually-hidden">Export JSON terminé</h1>
        </section>

      <section class="flow-screen error-screen" id="error-screen" hidden aria-labelledby="error-title">
        <h1 id="error-title">Impossible de démarrer SwagEx</h1>
        <p id="error-message" role="alert">—</p>
        <button class="primary-button" id="retry-action" type="button">Réessayer</button>
      </section>

      <section class="update-dialog" id="update-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="update-title">
        <div class="update-card">
          <h2 id="update-title">Mise à jour de SwagEx</h2>
          <p id="update-message">—</p>
          <p class="update-progress" id="update-progress" hidden></p>
          <div class="update-actions">
            <button class="update-secondary" id="update-dismiss" type="button">Plus tard</button>
            <button class="update-primary" id="update-install" type="button">Installer maintenant</button>
          </div>
        </div>
      </section>
    </section>
    </main>
  </body>
</html>
